<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crew Logs · MDB Production Board</title>
<style>
  :root{ --bg:#0b0d10; --panel:#15181c; --panel2:#1c2025; --line:#2a2f36; --text:#e8ecef; --muted:#8a9199; --accent:#3aa6ff; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; display:flex; flex-direction:column; padding:14px 16px; gap:10px; }
  #top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  h1{ margin:0; font-size:20px; }
  #back{ margin-left:auto; text-decoration:none; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; }
  #bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tab{ font:inherit; cursor:pointer; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:700; background:var(--panel2); border:1px solid var(--line); color:var(--text); }
  .tab.active{ background:var(--accent); border-color:var(--accent); color:#08131c; }
  .nav{ font:inherit; cursor:pointer; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:700; background:var(--panel2); border:1px solid var(--line); color:var(--text); }
  #date{ margin-left:auto; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:13px; padding:8px 10px; }
  #console{ flex:1; min-height:0; overflow-y:auto; background:#0b0f14; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:#cfd8e3; }
  .ln{ white-space:pre-wrap; word-break:break-word; }
  .t{ color:#6b7a8c; } .who{ color:#fff; font-weight:700; }
  .in{ color:#4ade80; } .out{ color:#fbbf24; } .mv{ color:#38bdf8; }
  #foot{ font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div id="top"><h1>📜 Crew Logs</h1><a id="back" href="/">← Back to board</a></div>
<div id="bar"><button class="tab active" data-crew="trench">🚜 Trench Logs</button><button class="tab" data-crew="hammer">🔨 Hammer Logs</button><button class="nav" id="topBtn">⬆ Top</button><button class="nav" id="endBtn">⬇ Latest</button><select id="date" aria-label="Day"></select></div>
<div id="console">Loading…</div>
<div id="foot"></div>
<script>
// ponytail: this logic is a copy of the Logs popup in index.html ("crew logs" block). Change both, or turn the popup into an iframe of this page if they drift.
(function(){
  var box = document.getElementById("console"), dateSel = document.getElementById("date"), foot = document.getElementById("foot");
  var crew = "trench", date = "";
  var short = function(j){ if(/^(mom's world|general|fg - shop)/i.test(j)) return "Shop"; return j.split(",")[0].replace(/\s+\d{4}.*$/, "").trim() || j; };
  var hm = function(s){ return String(s).slice(11, 16); };
  var mins = function(s){ return Number(String(s).slice(11, 13)) * 60 + Number(String(s).slice(14, 16)); };
  // shifts -> console events. A clock-out followed within 3 min by a clock-in on another job is ONE move; the same job is just a re-punch (hidden).
  function events(rows){
    var by = {}; rows.forEach(function(r){ (by[r.name] = by[r.name] || []).push(r); });
    var ev = [];
    Object.keys(by).forEach(function(n){
      var s = by[n].sort(function(a, b){ return a.time_in < b.time_in ? -1 : 1; });
      s.forEach(function(r, i){
        var prev = s[i - 1], next = s[i + 1];
        var joined = prev && prev.time_out && mins(r.time_in) - mins(prev.time_out) <= 3;
        if(joined){ if(short(prev.job) !== short(r.job)) ev.push({ t: r.time_in, n: n, k: "mv", txt: short(prev.job) + " → " + short(r.job), full: prev.job + " → " + r.job }); }
        else ev.push({ t: r.time_in, n: n, k: "in", txt: short(r.job), full: r.job });
        var nextJoined = next && r.time_out && mins(next.time_in) - mins(r.time_out) <= 3;
        if(r.time_out && !nextJoined) ev.push({ t: r.time_out, n: n, k: "out", txt: short(r.job), full: r.job });
      });
    });
    return ev.sort(function(a, b){ return a.t < b.t ? -1 : a.t > b.t ? 1 : a.n < b.n ? -1 : 1; });
  }
  function line(e){
    var d = document.createElement("div"); d.className = "ln"; d.title = e.full;
    var tag = { in: "IN  ", out: "OUT ", mv: "MOVE" }[e.k];
    [["t", hm(e.t) + "  "], [e.k, tag + "  "], ["who", e.n], ["", "  " + (e.k === "mv" ? "" : "· ") + e.txt]].forEach(function(p){ var sp = document.createElement("span"); if(p[0]) sp.className = p[0]; sp.textContent = p[1]; d.appendChild(sp); });
    return d;
  }
  function load(keepScroll){
    fetch("/api/analytics?log=" + crew + (date ? "&date=" + date : "")).then(function(r){ return r.json(); }).then(function(res){
      if(res.error){ box.textContent = "Error: " + res.error; return; }
      date = res.date;
      var dates = res.dates.indexOf(res.date) > -1 ? res.dates : [res.date].concat(res.dates);
      dateSel.textContent = ""; dates.forEach(function(d){ var o = document.createElement("option"); o.value = d; o.textContent = d; if(d === date) o.selected = true; dateSel.appendChild(o); });
      var atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      var ev = events(res.rows); box.textContent = "";
      if(!ev.length){ box.textContent = "No clock activity logged for this day yet."; }
      ev.forEach(function(e){ box.appendChild(line(e)); });
      if(!keepScroll || atEnd) box.scrollTop = box.scrollHeight; // newest at the bottom, like a console
      foot.textContent = res.rows.length + " shifts · BuilderTrend, refreshed every 5 min · " + (crew === "trench" ? "Trench roster" : "Hammer roster");
    }).catch(function(err){ box.textContent = "Couldn't load the log: " + err.message; });
  }
  document.getElementById("topBtn").addEventListener("click", function(){ box.scrollTop = 0; });
  document.getElementById("endBtn").addEventListener("click", function(){ box.scrollTop = box.scrollHeight; });
  dateSel.addEventListener("change", function(){ date = dateSel.value; load(false); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(tab){
    tab.addEventListener("click", function(){ crew = tab.dataset.crew; date = ""; Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){ t.classList.toggle("active", t === tab); }); load(false); });
  });
  load(false); setInterval(function(){ load(true); }, 60000);
})();
</script>
</body>
</html>
